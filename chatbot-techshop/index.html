<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chatbot TechShop do Exercício 068</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: #f8f7f5;
  color: #1e1916;
  font-family: "Nunito", Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
}

.chat-shell {
  width: 100%;
  max-width: 760px;
  background: #ffffff;
  border: 1px solid #e2ddd8;
  border-radius: 18px;
  box-shadow: 0 10px 32px rgba(30, 25, 22, 0.12);
  overflow: hidden;
}

.chat-head {
  padding: 28px 28px 20px;
  background: #e8f0fb;
  border-bottom: 1px solid #d6e2f2;
}

.chat-head h1 {
  font-size: 1.55rem;
  line-height: 1.25;
  color: #1f5fa6;
  margin-bottom: 10px;
}

.chat-head p {
  font-size: 0.98rem;
  line-height: 1.6;
  color: #3d3630;
  margin-bottom: 16px;
}

.info-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.info-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #ffffff;
  border: 1px solid #d6e2f2;
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 0.78rem;
  color: #3d3630;
}

.info-pill span:first-child {
  font-family: "Fira Code", monospace;
  font-weight: 500;
  color: #1f5fa6;
}

.info-pill span:last-child {
  font-family: "Fira Code", monospace;
  overflow-wrap: anywhere;
}

.chat-body {
  height: 420px;
  padding: 24px;
  overflow-y: auto;
  background: #fdfcfb;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg {
  max-width: 82%;
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 0.95rem;
  line-height: 1.55;
  white-space: pre-wrap;
}

.msg.bot {
  align-self: flex-start;
  background: #ffffff;
  border: 1px solid #e2ddd8;
  color: #2a2420;
  border-bottom-left-radius: 4px;
}

.msg.user {
  align-self: flex-end;
  background: #1f5fa6;
  color: #ffffff;
  border-bottom-right-radius: 4px;
}

.msg.error,
.msg.bot.error {
  background: #fceeed;
  border: 1px solid #e2b8b4;
  color: #7b1e1e;
}

.meta {
  margin-top: 8px;
  font-family: "Fira Code", monospace;
  font-size: 0.7rem;
  color: #7a726a;
}

.msg.user .meta {
  color: rgba(255, 255, 255, 0.75);
}

.chat-form {
  display: flex;
  gap: 10px;
  padding: 18px;
  background: #ffffff;
  border-top: 1px solid #e2ddd8;
}

.chat-form input {
  flex: 1;
  border: 1px solid #d8d0c8;
  border-radius: 12px;
  padding: 13px 14px;
  font-family: "Nunito", Arial, sans-serif;
  font-size: 0.96rem;
  outline: none;
}

.chat-form input:focus {
  border-color: #1f5fa6;
  box-shadow: 0 0 0 3px rgba(31, 95, 166, 0.12);
}

.chat-form button {
  border: none;
  border-radius: 12px;
  padding: 0 22px;
  background: #1f5fa6;
  color: #ffffff;
  font-family: "Nunito", Arial, sans-serif;
  font-size: 0.95rem;
  font-weight: 800;
  cursor: pointer;
}

.chat-form button:hover {
  background: #194f8c;
}

.chat-form button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 0 18px 18px;
  background: #ffffff;
}

.actions button {
  border: 1px solid #d8d0c8;
  border-radius: 999px;
  background: #f8f7f5;
  color: #3d3630;
  font-family: "Nunito", Arial, sans-serif;
  font-size: 0.82rem;
  font-weight: 700;
  padding: 8px 12px;
  cursor: pointer;
}

.actions button:hover {
  border-color: #1f5fa6;
  color: #1f5fa6;
  background: #e8f0fb;
}

@media (max-width: 640px) {
  body {
    padding: 16px;
    align-items: stretch;
  }

  .chat-shell {
    min-height: calc(100vh - 32px);
    display: flex;
    flex-direction: column;
  }

  .chat-head {
    padding: 22px 18px 16px;
  }

  .chat-head h1 {
    font-size: 1.28rem;
  }

  .chat-body {
    flex: 1;
    height: auto;
    min-height: 360px;
    padding: 18px;
  }

  .msg {
    max-width: 94%;
  }

  .chat-form {
    flex-direction: column;
  }

  .chat-form button {
    padding: 12px;
  }
}
</style>
</head>

<body class="page-arquivos-068-index">

<main class="chat-shell">

  <section class="chat-head">
    <h1>Chatbot TechShop do Exercício 068</h1>

    <p>Tela de teste para FAQ, produtos cadastrados, trava de produto fora do catálogo e IA controlada.</p>

    <div class="info-row">
      <div class="info-pill">
        <span>api:</span>
        <span>/chat</span>
      </div>

      <div class="info-pill">
        <span>user_id:</span>
        <span id="userIdView"></span>
      </div>
    </div>
  </section>

  <section class="chat-body" id="chatBody">
    <div class="msg bot">
      Olá! Pergunte sobre horário, endereço, pagamento, produtos da TechShop ou teste um produto que não está no catálogo.
    </div>
  </section>

  <form class="chat-form" id="chatForm">
    <input
      id="mensagem"
      type="text"
      placeholder="Digite sua mensagem..."
      autocomplete="off"
    />

    <button id="btnEnviar" type="submit">
      Enviar
    </button>
  </form>

  <div class="actions">
    <button type="button" data-text="Tem iPhone 17 disponível?">
      teste rápido
    </button>

    <button type="button" id="btnNovoId">
      gerar novo user_id
    </button>

    <button type="button" id="btnLimpar">
      limpar conversa da tela
    </button>
  </div>

</main>

<script>
const API_URL = "/chat";
const STORAGE_KEY = "aluno_068_user_id";

const chatBody = document.getElementById("chatBody");
const chatForm = document.getElementById("chatForm");
const inputMensagem = document.getElementById("mensagem");
const btnEnviar = document.getElementById("btnEnviar");
const btnNovoId = document.getElementById("btnNovoId");
const btnLimpar = document.getElementById("btnLimpar");
const userIdView = document.getElementById("userIdView");

function criarUserId() {
  if (window.crypto && crypto.randomUUID) {
    return "aluno_068_" + crypto.randomUUID();
  }

  return "aluno_068_" + Date.now() + "_" + Math.random().toString(16).slice(2);
}

function obterUserId() {
  let userId = localStorage.getItem(STORAGE_KEY);

  if (!userId) {
    userId = criarUserId();
    localStorage.setItem(STORAGE_KEY, userId);
  }

  return userId;
}

function atualizarUserIdNaTela() {
  userIdView.textContent = obterUserId();
}

function adicionarMensagem(texto, tipo, origem) {
  const div = document.createElement("div");
  div.className = "msg " + tipo;
  div.textContent = texto;

  if (origem) {
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = "origem: " + origem;
    div.appendChild(meta);
  }

  chatBody.appendChild(div);
  chatBody.scrollTop = chatBody.scrollHeight;
}

async function enviarMensagem(texto) {
  const resposta = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      texto: texto,
      user_id: obterUserId()
    })
  });

  if (!resposta.ok) {
    throw new Error("Erro ao chamar a API.");
  }

  return resposta.json();
}

chatForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  const texto = inputMensagem.value.trim();

  if (!texto) {
    return;
  }

  adicionarMensagem(texto, "user");

  inputMensagem.value = "";
  btnEnviar.disabled = true;

  try {
    const dados = await enviarMensagem(texto);

    adicionarMensagem(
      dados.resposta || "Sem resposta.",
      dados.origem === "erro" ? "bot error" : "bot",
      dados.origem
    );
  } catch (erro) {
    adicionarMensagem(
      "Não foi possível conversar com a API. Confira se o projeto foi publicado corretamente no Vercel.",
      "bot error"
    );
  } finally {
    btnEnviar.disabled = false;
    inputMensagem.focus();
  }
});

document.querySelectorAll("[data-text]").forEach(function(botao) {
  botao.addEventListener("click", function() {
    inputMensagem.value = botao.dataset.text;
    inputMensagem.focus();
  });
});

btnNovoId.addEventListener("click", function() {
  const novoId = criarUserId();

  localStorage.setItem(STORAGE_KEY, novoId);
  atualizarUserIdNaTela();

  adicionarMensagem("Novo user_id criado para este navegador.", "bot");
});

btnLimpar.addEventListener("click", function() {
  chatBody.innerHTML = "";
  adicionarMensagem("Conversa limpa apenas na tela.", "bot");
});

atualizarUserIdNaTela();

inputMensagem.value = "Tem iPhone 17 disponível?";
inputMensagem.focus();
</script>

</body>
</html>
